<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tic-Tac-Toe</title>
    <link rel="stylesheet" href="style.css" />
    <script>
      document.documentElement.dataset.theme =
        localStorage.getItem("ttt-theme") === "light" ? "light" : "dark";
    </script>
  </head>
  <body>
    <div class="app">
      <main class="stage">
        <p class="kicker">Full line wins</p>
        <h1>Tic-Tac-Toe</h1>
        <p id="status" class="status" aria-live="polite">Player 1 to move</p>
        <div id="board" class="board" data-size="3" aria-label="Tic-tac-toe board"></div>
        <button id="restart" class="restart" type="button">Play again</button>
      </main>

      <aside class="rail" aria-label="Game settings">
        <button id="theme" class="theme" type="button" aria-pressed="true">
          <span class="theme-track" aria-hidden="true"><span class="theme-knob"></span></span>
          <span class="theme-copy">
            <span class="theme-kicker">Appearance</span>
            <span class="theme-label">Dark</span>
          </span>
        </button>

        <section class="panel">
          <h2>Players</h2>
          <label class="player" id="card-x">
            <span class="badge" aria-hidden="true">X</span>
            <span class="field">
              <span class="field-label">Player 1</span>
              <input id="name-x" name="player1" maxlength="18" autocomplete="nickname" value="Player 1" />
            </span>
          </label>
          <label class="player" id="card-o">
            <span class="badge badge-o" aria-hidden="true">O</span>
            <span class="field">
              <span class="field-label">Player 2</span>
              <input id="name-o" name="player2" maxlength="18" autocomplete="nickname" value="Player 2" />
            </span>
          </label>
        </section>

        <section class="panel">
          <h2>Grid</h2>
          <div class="sizes" role="group" aria-label="Grid size">
            <button type="button" data-size="3" aria-pressed="true">3×3</button>
            <button type="button" data-size="4" aria-pressed="false">4×4</button>
            <button type="button" data-size="5" aria-pressed="false">5×5</button>
          </div>
          <p class="hint">A win is a full row, column, or diagonal.</p>
        </section>

        <section class="panel scorecard">
          <h2>Scoreboard</h2>
          <div class="score-grid">
            <div class="score-cell" id="score-card-x">
              <span class="score-name" id="score-name-x">Player 1</span>
              <span class="score-num" id="score-x">0</span>
              <span class="score-sub">wins</span>
            </div>
            <div class="score-cell score-draws">
              <span class="score-name">Draws</span>
              <span class="score-num" id="score-draws">0</span>
              <span class="score-sub">&nbsp;</span>
            </div>
            <div class="score-cell" id="score-card-o">
              <span class="score-name" id="score-name-o">Player 2</span>
              <span class="score-num" id="score-o">0</span>
              <span class="score-sub">wins</span>
            </div>
          </div>
          <p class="score-total">Matches played <strong id="score-total">0</strong></p>
          <h3>Recent matches</h3>
          <ol id="history" class="history"></ol>
          <button id="reset-scores" class="reset-scores" type="button">Reset scores</button>
        </section>
      </aside>
    </div>
    <script src="script.js"></script>
  </body>
</html>
