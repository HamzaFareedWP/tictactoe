<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tic-Tac-Toe</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="table">
      <p class="kicker">After hours</p>
      <h1>Tic-Tac-Toe</h1>
      <p id="status" class="status" aria-live="polite">X to move</p>
      <div id="board" class="board" aria-label="Tic-tac-toe board">
        <button type="button" data-cell="0" aria-label="Top left, empty"></button>
        <button type="button" data-cell="1" aria-label="Top center, empty"></button>
        <button type="button" data-cell="2" aria-label="Top right, empty"></button>
        <button type="button" data-cell="3" aria-label="Middle left, empty"></button>
        <button type="button" data-cell="4" aria-label="Center, empty"></button>
        <button type="button" data-cell="5" aria-label="Middle right, empty"></button>
        <button type="button" data-cell="6" aria-label="Bottom left, empty"></button>
        <button type="button" data-cell="7" aria-label="Bottom center, empty"></button>
        <button type="button" data-cell="8" aria-label="Bottom right, empty"></button>
      </div>
      <button id="restart" class="restart" type="button">Restart</button>
    </main>
    <script src="script.js"></script>
  </body>
</html>
